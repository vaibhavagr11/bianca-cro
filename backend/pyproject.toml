[project]
name = "bianca-cro-backend"
version = "0.1.0"
description = "Bianca CRO backend: pipeline, email, calendar and meeting-note ingestion; commitments; morning brief"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "anthropic>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
